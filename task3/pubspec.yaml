name: profile_screen
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/profile.jpg
  fonts:
    - family: ProfileFont
      fonts:
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
